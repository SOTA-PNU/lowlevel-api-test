name: Publish Results

"on":
  workflow_run:
    workflows: ["Stable Test", "Atom Max Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publish-results
  cancel-in-progress: false

env:
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    name: Collect and build dashboard
    # Never publish results of pull-request runs, which may come from forks.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.collect.outputs.found }}
      publish: ${{ steps.collect.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest results
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          # Latest completed run of each test workflow on the source branch that has results.
          for workflow in stable_test.yml atom_max_test.yml; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w "$workflow" -b "$SOURCE_BRANCH" \
                          -s completed -L 5 --json databaseId --jq '.[].databaseId'); do
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'results-*' -D "incoming/$id" 2>/dev/null; then
                echo "$workflow: run $id"
                break
              fi
            done
          done
          find incoming -name '*.json' | sort
          if find incoming -name '*.json' | grep -q .; then found=true; else found=false; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$SOURCE_BRANCH" = "$DEFAULT_BRANCH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$found" = true ] || echo "::notice::No result artifacts found for $SOURCE_BRANCH; nothing to publish."

      - name: Update results store
        if: ${{ steps.collect.outputs.found == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.collect.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != true ]; then
            # Branch preview: dashboard of this branch's latest runs only, nothing is stored.
            python3 report/store.py incoming store/data
            exit 0
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" results >/dev/null; then
            git clone --quiet --branch results --single-branch "$remote" store
          else
            git init --quiet -b results store
            git -C store remote add origin "$remote"
          fi
          python3 report/store.py incoming store/data
          git -C store add data
          if git -C store diff --cached --quiet; then
            echo "results store is up to date"
          else
            git -C store -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Store results from ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
            git -C store push --quiet origin results
          fi

      - name: Build dashboard
        if: ${{ steps.collect.outputs.found == 'true' }}
        run: python3 report/build_site.py --data store/data --out _site

      - name: Upload preview
        if: ${{ steps.collect.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ env.SOURCE_BRANCH }}
          path: _site
          retention-days: 30

      - name: Upload Pages artifact
        if: ${{ steps.collect.outputs.found == 'true' && steps.collect.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ needs.build.outputs.found == 'true' && needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
