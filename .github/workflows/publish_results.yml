name: Publish Results

# Called at the end of each test workflow. Stores this run's results-*
# artifacts in the gh-pages branch and rebuilds that branch's dashboard:
# the default branch at the site root, other branches under branches/<name>/.
"on":
  workflow_call:

jobs:
  publish:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: incoming

      - name: Update gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! find incoming -name '*.json' 2>/dev/null | grep -q .; then
            echo "::notice::No results in this run; nothing to publish."
            exit 0
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Retry from a fresh clone if another run pushed first.
          for attempt in 1 2 3 4 5; do
            rm -rf site
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
              git clone --quiet --depth 1 --branch gh-pages --single-branch "$remote" site
            else
              git init --quiet -b gh-pages site
              git -C site remote add origin "$remote"
            fi
            python3 report/publish.py --site site --branch "$BRANCH" \
              --default-branch "$DEFAULT_BRANCH" --incoming incoming
            git -C site add -A
            if git -C site diff --cached --quiet; then
              echo "gh-pages is up to date"
              break
            fi
            git -C site -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish ${BRANCH} results from ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
            if git -C site push --quiet origin gh-pages; then
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "::error::Could not push to gh-pages"; exit 1; }
            sleep $((attempt * 5))
          done
          # Pages may use a custom domain, so ask the API for the site URL.
          site_url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$site_url" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            site_url="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          path=""
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            path="branches/$(cd report && python3 -c 'import sys, publish; print(publish.branch_slug(sys.argv[1]))' "$BRANCH")/"
          fi
          url="${site_url%/}/${path}"
          echo "Dashboard: $url"
          echo "Dashboard: $url" >> "$GITHUB_STEP_SUMMARY"
