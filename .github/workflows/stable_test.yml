name: Stable Test

"on":
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      force_build:
        description: Force Docker image rebuild
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_release:
        description: Push release Docker tags
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/sota-pnu/lowlevel-api-test
  # Report to the lab CI/CD HUD (https://sota.pusan.ac.kr/cicd/). HUD steps never change this CI's result.
  HUD_URL: ${{ vars.HUD_URL || 'https://sota.pusan.ac.kr/cicd' }}
  HUD_TOKEN: ${{ secrets.HUD_TOKEN }}
  HUD_EXPECTED_HW: cpu,gpu,npu

jobs:
  detect-changes:
    name: Detect Build Inputs
    runs-on: [self-hosted, cpu-runner]
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect relevant changes
        id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          if [ "${FORCE_BUILD}" = "true" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${REF_TYPE}" = "tag" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ github.event.created }}" = "true" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BEFORE}" "${SHA}" || true)"
          echo "${changed_files}"

          if echo "${changed_files}" | grep -Fxq \
            -e ".github/workflows/stable_test.yml" \
            -e "docker/Dockerfile" \
            -e ".dockerignore"; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          fi

  build-cpu:
    name: Build CPU Image
    runs-on: [self-hosted, cpu-runner]
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.should_build == 'true' }}
    env:
      DOCKER_IMAGE_TAG: cpu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
 
          echo ">>> Building Docker image with host Docker"

          docker build \
            --cache-from "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            -f docker/Dockerfile \
            -t "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            --build-arg BUILD_MODE=cpu \
            .
          docker image prune -f
          docker system df

      - name: "[HUD] Report build failure"
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job build cpu failure
          $HUD failure cpu build --summary "Docker image build failed (see CI log)"
          $HUD finish failure

  build-gpu:
    name: Build GPU Image
    runs-on: [self-hosted, gpu-runner]
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.should_build == 'true' }}
    env:
      DOCKER_IMAGE_TAG: gpu-latest
    steps:
      - name: Check GPU Environment
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error:: nvidia-smi is not available on this runner."
            exit 1
          fi

          nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> Building Docker image with host Docker"

          docker build \
            --cache-from "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            -f docker/Dockerfile \
            -t "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            --build-arg BUILD_MODE=cuda \
            .
          docker image prune -f
          docker system df

      - name: "[HUD] Report build failure"
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job build gpu failure
          $HUD failure gpu build --summary "Docker image build failed (see CI log)"
          $HUD finish failure

  build-npu:
    name: Build NPU Image
    runs-on: [self-hosted, npu-runner]
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.should_build == 'true' }}
    env:
      DOCKER_IMAGE_TAG: npu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        env:
          RBLN_PIP_CONFIG: ${{ secrets.RBLN_PIP_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${RBLN_PIP_CONFIG:-}" ]; then
            echo "::error:: Repository secret RBLN_PIP_CONFIG is required for the NPU image build."
            exit 1
          fi

          echo ">>> Building NPU image with pip-installed rebel-compiler"
          
          docker build \
            --cache-from "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            -f docker/Dockerfile \
            -t "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" \
            --secret id=rbln_pip_config,env=RBLN_PIP_CONFIG \
            --build-arg BUILD_MODE=npu \
            .
          docker image prune -f
          docker system df

      - name: "[HUD] Report build failure"
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job build npu failure
          $HUD failure npu build --summary "Docker image build failed (see CI log)"
          $HUD finish failure

  test-cpu:
    name: Test CPU Image
    runs-on: [self-hosted, cpu-runner]
    needs:
      - detect-changes
      - build-cpu
    if: ${{ always() && needs.detect-changes.result == 'success' && (needs.build-cpu.result == 'success' || needs.build-cpu.result == 'skipped') }}
    env:
      DOCKER_IMAGE_TAG: cpu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[HUD] Start"
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job lint cpu skipped
          $HUD job build cpu ${{ needs.build-cpu.result }}
          $HUD job correctness cpu running
          $HUD job benchmark cpu running

      - name: Run tests
        shell: bash
        env:
          RESULTS_JSON: ${{ github.workspace }}/results.json
        run: |
          set -euo pipefail

          unset DOCKER_HOST DOCKER_TLS_CERTDIR
          if ! docker image inspect "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error:: Missing ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}. Re-run this workflow with force_build=true."
            exit 1
          fi
          bash docker/run-docker.sh test-cpu

      - name: "[HUD] Report"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          $HUD triton cpu results.json --status "${{ job.status }}"
          $HUD finish "${{ job.status == 'success' && 'success' || 'failure' }}"

      - name: Summarize results
        if: ${{ always() && hashFiles('results.json') != '' }}
        shell: bash
        run: python3 report/summary.py results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && hashFiles('results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-cpu
          path: results.json
          retention-days: 90

  test-gpu:
    name: Test GPU Image
    runs-on: [self-hosted, gpu-runner]
    needs:
      - detect-changes
      - build-gpu
    if: ${{ always() && needs.detect-changes.result == 'success' && (needs.build-gpu.result == 'success' || needs.build-gpu.result == 'skipped') }}
    env:
      DOCKER_IMAGE_TAG: gpu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[HUD] Start"
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job lint gpu skipped
          $HUD job build gpu ${{ needs.build-gpu.result }}
          $HUD job correctness gpu running
          $HUD job benchmark gpu running

      - name: Run tests 
        shell: bash
        env:
          RESULTS_JSON: ${{ github.workspace }}/results.json
        run: |
          set -euo pipefail

          unset DOCKER_HOST DOCKER_TLS_CERTDIR
          if ! docker image inspect "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error:: Missing ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}. Re-run this workflow with force_build=true."
            exit 1
          fi
          bash docker/run-docker.sh test-cuda

      - name: "[HUD] Report"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          $HUD triton gpu results.json --status "${{ job.status }}"
          $HUD finish "${{ job.status == 'success' && 'success' || 'failure' }}"

      - name: Summarize results
        if: ${{ always() && hashFiles('results.json') != '' }}
        shell: bash
        run: python3 report/summary.py results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && hashFiles('results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-gpu
          path: results.json
          retention-days: 90

  test-npu:
    name: Test NPU Image
    runs-on: [self-hosted, npu-runner]
    needs:
      - detect-changes
      - build-npu
    if: ${{ always() && needs.detect-changes.result == 'success' && (needs.build-npu.result == 'success' || needs.build-npu.result == 'skipped') }}
    env:
      DOCKER_IMAGE_TAG: npu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[HUD] Start"
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job lint npu skipped
          $HUD job build npu ${{ needs.build-npu.result }}
          $HUD job correctness npu running
          $HUD job benchmark npu running

      - name: Run tests
        shell: bash
        env:
          RESULTS_JSON: ${{ github.workspace }}/results.json
        run: |
          set -euo pipefail

          unset DOCKER_HOST DOCKER_TLS_CERTDIR
          if ! docker image inspect "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::Missing NPU image ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}. Refusing to run NPU tests with the generic latest image. Re-run this workflow with force_build=true."
            exit 1
          fi
          bash docker/run-docker.sh test-npu

      - name: "[HUD] Report"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          $HUD triton npu results.json --status "${{ job.status }}"
          $HUD finish "${{ job.status == 'success' && 'success' || 'failure' }}"

      - name: Summarize results
        if: ${{ always() && hashFiles('results.json') != '' }}
        shell: bash
        run: python3 report/summary.py results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && hashFiles('results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-npu
          path: results.json
          retention-days: 90

  publish:
    name: Publish results
    needs: [test-cpu, test-gpu, test-npu]
    # Publish branch runs only; never tag or pull-request runs.
    if: ${{ always() && github.ref_type == 'branch' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      pages: read
    uses: ./.github/workflows/publish_results.yml

  release-cpu:
    name: Release CPU Image
    runs-on: [self-hosted, cpu-runner]
    needs: test-cpu
    if: ${{ needs.test-cpu.result == 'success' && (vars.ENABLE_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_release == 'true')) }}
    env:
      ENV_TAG: cpu
      DOCKER_IMAGE_TAG: cpu-latest
    steps:
      - name: Push release image
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:main-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:main-${ENV_TAG}"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
          fi

  release-gpu:
    name: Release GPU Image
    runs-on: [self-hosted, gpu-runner]
    needs: test-gpu
    if: ${{ needs.test-gpu.result == 'success' && (vars.ENABLE_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_release == 'true')) }}
    env:
      ENV_TAG: gpu
      DOCKER_IMAGE_TAG: gpu-latest
    steps:
      - name: Push release image
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:main-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:main-${ENV_TAG}"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
          fi

  release-npu:
    name: Release NPU Image
    runs-on: [self-hosted, npu-runner]
    needs: test-npu
    if: ${{ needs.test-npu.result == 'success' && (vars.ENABLE_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_release == 'true')) }}
    env:
      ENV_TAG: npu
      DOCKER_IMAGE_TAG: npu-latest
    steps:
      - name: Push release image
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:main-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:main-${ENV_TAG}"
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}" "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
            docker push "${DOCKER_IMAGE}:${GITHUB_REF_NAME}-${ENV_TAG}"
          fi